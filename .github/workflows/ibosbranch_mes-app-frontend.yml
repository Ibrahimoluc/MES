# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy React app to Azure Web App - mes-app-frontend

on:
  push:
    branches:
      - ibosBranch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for checkout

    steps:
      #  Kodun çekilmesi
      - uses: actions/checkout@v4

      #  Node kurulumu
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      #  Paketlerin kurulumu ve build
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      #  Sadece build klasörünü kaydet
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      #  Build çıktısının indirilmesi
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      #  Azure'a giriş
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3D88E132CDE6444E8F03D21C1898D144 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8198DF3EED5F4BBEBA0D24C63761FC04 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_715028A717684F5786AC6969F7A1579D }}

      #  Build klasörünü App Service'e yükle
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mes-app-frontend'
          slot-name: 'Production'
          package: build

          